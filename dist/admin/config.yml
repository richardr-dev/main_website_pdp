backend:
  name: github
  repo: richardr-dev/main_website_pdp
  branch: main
  auth_methods: [token]

media_folder: public/uploads
public_folder: /uploads
site_url: https://patuhdata.id
display_url: https://patuhdata.id
logo_url: /logo.png

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: src/content/blog
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title, category]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL slug, name: slug, widget: string, hint: "Lowercase words separated by hyphens. Do not change after publishing." }
      - { label: Summary, name: excerpt, widget: text }
      - { label: Category, name: category, widget: string, default: Insights }
      - { label: Publish date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { label: Author, name: author, widget: string, default: PatuhData }
      - { label: Reading time, name: readTime, widget: string, default: "5 min read" }
      - { label: Featured image, name: image, widget: image, required: false }
      - { label: Image description, name: imageAlt, widget: string, required: false, hint: "Describe the image for accessibility." }
      - { label: Pin to homepage, name: pinned, widget: boolean, default: false, hint: "Pinned posts appear first in the three homepage recommendations." }
      - { label: Published, name: published, widget: boolean, default: false }
      - { label: Article, name: body, widget: markdown }
